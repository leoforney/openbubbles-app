plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "dev.flutter.flutter-gradle-plugin"
    id "io.objectbox"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.bluebubbles.messaging"
    compileSdk 36
    ndkVersion "28.0.12433566"


    defaultConfig {
        applicationId "com.bluebubbles.messaging"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 20002000 + flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
        debug {

        }
    }

    flavorDimensions = ["app"]

    productFlavors {
        joel {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles Dev (Joel)"
            resValue "color", "ic_launcher_background", "#4c49de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.joel.fileprovider"
            applicationId "com.bluebubbles.messaging.joel"
        }
        tanay {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles (Tanay Special Sauce)"
            resValue "color", "ic_launcher_background", "#4c49de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.tanay.fileprovider"
            applicationId "com.bluebubbles.messaging.tanay"
        }
        alpha {
            dimension "app"
            resValue "string", "app_name_en", "OpenBubbles (Alpha)"
            resValue "color", "ic_launcher_background", "#49dbde"
            resValue "string", "file_provider", "com.bluebubbles.messaging.alpha.fileprovider"
            applicationId "com.bluebubbles.messaging.alpha"
        }
        beta {
            dimension "app"
            resValue "string", "app_name_en", "OpenBubbles (Beta)"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.beta.fileprovider"
            applicationId "com.bluebubbles.messaging.beta"
        }
        prod {
            getIsDefault().set(true)
            dimension "app"
            resValue "string", "app_name_en", "OpenBubbles"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.openbubbles.messaging.fileprovider"
            applicationId "com.openbubbles.messaging"
        }
    }

    buildFeatures {
        aidl true
        viewBinding true
        compose true
    }

    buildTypes {
        release {
            productFlavors.joel.signingConfig signingConfigs.debug
            productFlavors.tanay.signingConfig signingConfigs.debug
            productFlavors.alpha.signingConfig signingConfigs.debug
            productFlavors.beta.signingConfig signingConfigs.release
            productFlavors.prod.signingConfig signingConfigs.release
            productFlavors.alpha.signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', 'src/main/java/workers'
            }
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    androidResources {
        noCompress 'tflite'
    }
    lint {
        checkReleaseBuilds false
        disable 'InvalidPackage'
    }
}

flutter {
    source '../..'
}

// ---------------------------------------------------------------------------
// Rust Native Build & UniFFI Binding Generation
// ---------------------------------------------------------------------------
def rustRootDir = rootProject.file("../rust")
def cargoTargetDir = rootProject.file(".cargo_target")
def rustLibName = "rust_lib_bluebubbles"
def rustAbis = ["arm64-v8a": "aarch64-linux-android", "armeabi-v7a": "armv7-linux-androideabi"]
def rustApi = 28

// Host build + UniFFI Kotlin bindings task
def hostSoFile = new File(cargoTargetDir, "debug/lib${rustLibName}.so")
def uniffiOutDir = file("src/main/kotlin")

tasks.register("rustUniffiKotlin") {
    inputs.files(
        file("${rustRootDir}/src/native.rs"),
        file("${rustRootDir}/src/native_types.rs"),
        file("${rustRootDir}/src/keystore.rs"),
        file("${rustRootDir}/Cargo.toml")
    )
    outputs.dir(new File(uniffiOutDir, "uniffi"))

    doLast {
        def ndkDir = android.ndkDirectory ?: (android.ndkVersion ? new File(android.sdkDirectory, "ndk/${android.ndkVersion}") : null)
        project.exec {
            workingDir = rustRootDir
            commandLine "cargo", "build", "--target-dir", cargoTargetDir.absolutePath
            if (ndkDir != null && ndkDir.exists()) {
                environment "NDK_HOME", ndkDir.absolutePath
                environment "ANDROID_NDK_HOME", ndkDir.absolutePath
            }
        }
        project.exec {
            workingDir = rustRootDir
            commandLine "cargo", "run", "--bin", "uniffi-bindgen", "generate",
                "--library", hostSoFile.absolutePath,
                "--language", "kotlin",
                "--out-dir", uniffiOutDir.absolutePath
        }
    }
}

android.applicationVariants.all { variant ->
    def buildType = variant.buildType.name
    def isRelease = (buildType == "release")
    def variantOutputsDir = file("${buildDir}/rustlib/${variant.name}")

    def rustBuildTasks = []

    rustAbis.each { abi, targetTriple ->
        def taskName = "rustBuild_${rustLibName}_${abi}_${variant.name}"
        def outAbiDir = new File(variantOutputsDir, abi)
        def targetProfile = isRelease ? "release" : "debug"
        def builtSoFile = new File(cargoTargetDir, "${targetTriple}/${targetProfile}/lib${rustLibName}.so")

        def rustTask = tasks.register(taskName, Exec) {
            workingDir = rustRootDir

            def cmd = ["cargo", "ndk", "-t", abi, "-P", "${rustApi}", "build", "--target-dir", cargoTargetDir.absolutePath]
            if (isRelease) {
                cmd.add("--release")
            }
            commandLine cmd

            def ndkDir = android.ndkDirectory ?: (android.ndkVersion ? new File(android.sdkDirectory, "ndk/${android.ndkVersion}") : null)
            if (ndkDir != null && ndkDir.exists()) {
                environment "NDK_HOME", ndkDir.absolutePath
                environment "ANDROID_NDK_HOME", ndkDir.absolutePath
            }

            inputs.files(
                fileTree(rustRootDir) {
                    include "**/*.rs"
                    exclude "target/**"
                },
                fileTree(rootProject.file("../rustpush")) {
                    include "**/*.rs"
                    exclude "target/**"
                },
                file("${rustRootDir}/Cargo.toml"),
                file("${rustRootDir}/Cargo.lock"),
                file("${rustRootDir}/build.rs"),
                file("${rustRootDir}/.cargo/config.toml")
            )
            outputs.dir(outAbiDir)

            doLast {
                outAbiDir.mkdirs()
                copy {
                    from builtSoFile
                    into outAbiDir
                }
            }
        }
        rustBuildTasks.add(rustTask)
    }

    // Only the variant-specific source set: variant.sourceSets also contains shared ones
    // (main, debug, flavor), which would leak every variant's .so into every other variant.
    android.sourceSets.maybeCreate(variant.name).jniLibs.srcDir(variantOutputsDir)

    def capitalizedVariant = variant.name.capitalize()
    // toString(): `in` on a list of GStrings never matches a String task name
    def mergeTaskNames = ["merge${capitalizedVariant}JniLibFolders", "merge${capitalizedVariant}NativeLibs", "merge${variant.buildType.name.capitalize()}NativeLibs"]*.toString()
    tasks.matching { it.name in mergeTaskNames }.configureEach { mergeTask ->
        mergeTask.dependsOn(rustBuildTasks)
    }
    // Kotlin bindings live in src/main/kotlin and must be regenerated before anything reads the
    // sources (kapt, compile), or the dex and the .so drift apart
    tasks.matching { it.name == "pre${capitalizedVariant}Build".toString() }.configureEach { preTask ->
        preTask.dependsOn("rustUniffiKotlin")
    }
}


// For Cloud Firestore okio error
configurations.all { configuration ->
    if (!configuration.name.toLowerCase().contains("kapt")) {
        resolutionStrategy {
            force 'com.squareup.okhttp:okhttp:2.7.5'
            force 'com.squareup.okio:okio:1.17.5'
        }
    }
}

dependencies {
    implementation "io.objectbox:objectbox-kotlin:$objectboxVersion"
    // Jetpack Compose
    def compose_bom = platform("androidx.compose:compose-bom:2024.09.02")
    implementation compose_bom
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.animation:animation-core"
    implementation "net.engawapg.lib:zoomable:1.5.0"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5"
    implementation "androidx.navigation:navigation-compose:2.8.1"

    implementation "io.coil-kt:coil-compose:2.6.0"

    // Android native functions
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.sharetarget:sharetarget:1.2.0"
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.concurrent:concurrent-futures-ktx:1.2.0"

    // Firebase items
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    implementation 'com.google.firebase:firebase-database:21.0.0'
    implementation 'com.google.firebase:firebase-messaging-directboot:24.0.0'
    implementation 'com.google.firebase:firebase-iid:21.1.0'
    implementation 'com.google.firebase:firebase-firestore:25.0.0'

    // Kotlin Coroutines (async)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.8.1"

    // Socket IO
    implementation ('io.socket:socket.io-client:2.1.1') {
        // excluding org.json which is provided by Android
        exclude group: 'org.json', module: 'json'
    }

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // For AGP 7.4+ desugaring
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")

    // Unified Push
    implementation 'org.unifiedpush.android:connector:2.5.0'

    // uniffi JNA dependency
    implementation "net.java.dev.jna:jna:5.12.0@aar"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.6.0"

    // heic decoding
    implementation 'com.github.awxkee:avif-coder:1.8.0'

    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:$shizuku_version"

    // Add this line if you want to support Shizuku
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    // support credential provider
    implementation "androidx.credentials:credentials:1.6.0-rc01"
    implementation "androidx.biometric:biometric:1.1.0"

    // CBOR encoding (WebAuthn)
    implementation "com.upokecenter:cbor:4.5.2"

    implementation "androidx.autofill:autofill:1.3.0"
}
