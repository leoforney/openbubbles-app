plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "dev.flutter.flutter-gradle-plugin"
    id "io.objectbox"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.bluebubbles.messaging"
    compileSdk 36
    ndkVersion "28.0.12433566"


    defaultConfig {
        applicationId "com.bluebubbles.messaging"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 20002000 + flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
        debug {

        }
    }

    flavorDimensions = ["app"]

    productFlavors {
        joel {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles Dev (Joel)"
            resValue "color", "ic_launcher_background", "#4c49de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.joel.fileprovider"
            applicationId "com.bluebubbles.messaging.joel"
        }
        tanay {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles (Tanay Special Sauce)"
            resValue "color", "ic_launcher_background", "#4c49de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.tanay.fileprovider"
            applicationId "com.bluebubbles.messaging.tanay"
        }
        alpha {
            dimension "app"
            resValue "string", "app_name_en", "OpenBubbles (Alpha)"
            resValue "color", "ic_launcher_background", "#49dbde"
            resValue "string", "file_provider", "com.bluebubbles.messaging.alpha.fileprovider"
            applicationId "com.bluebubbles.messaging.alpha"
        }
        beta {
            dimension "app"
            resValue "string", "app_name_en", "OpenBubbles (Beta)"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.beta.fileprovider"
            applicationId "com.bluebubbles.messaging.beta"
        }
        prod {
            getIsDefault().set(true)
            dimension "app"
            resValue "string", "app_name_en", "OpenBubbles"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.openbubbles.messaging.fileprovider"
            applicationId "com.openbubbles.messaging"
        }
    }

    buildFeatures {
        aidl true
        viewBinding true
        compose true
    }

    buildTypes {
        release {
            productFlavors.joel.signingConfig signingConfigs.debug
            productFlavors.tanay.signingConfig signingConfigs.debug
            productFlavors.alpha.signingConfig signingConfigs.debug
            productFlavors.beta.signingConfig signingConfigs.release
            productFlavors.prod.signingConfig signingConfigs.release
            productFlavors.alpha.signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', 'src/main/java/workers'
            }
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    androidResources {
        noCompress 'tflite'
    }
    lint {
        checkReleaseBuilds false
        disable 'InvalidPackage'
    }
}

flutter {
    source '../..'
}

// ---------------------------------------------------------------------------
// Rust Native Build & UniFFI Binding Generation
// ---------------------------------------------------------------------------
def rustRootDir = rootProject.file("../rust")
def cargoTargetDir = rootProject.file(".cargo_target")
def rustLibName = "rust_lib_bluebubbles"
def rustAbis = ["arm64-v8a": "aarch64-linux-android", "armeabi-v7a": "armv7-linux-androideabi"]
def rustApi = 28

// Host build + UniFFI Kotlin bindings task
def hostSoFile = new File(cargoTargetDir, "debug/lib${rustLibName}.so")
def uniffiOutDir = file("src/main/kotlin")

tasks.register("rustUniffiKotlin") {
    inputs.files(
        file("${rustRootDir}/src/native.rs"),
        file("${rustRootDir}/src/native_types.rs"),
        file("${rustRootDir}/src/keystore.rs"),
        file("${rustRootDir}/Cargo.toml")
    )
    outputs.dir(new File(uniffiOutDir, "uniffi"))

    doLast {
        def ndkDir = android.ndkDirectory ?: (android.ndkVersion ? new File(android.sdkDirectory, "ndk/${android.ndkVersion}") : null)
        project.exec {
            workingDir = rustRootDir
            commandLine "cargo", "build", "--target-dir", cargoTargetDir.absolutePath
            if (ndkDir != null && ndkDir.exists()) {
                environment "NDK_HOME", ndkDir.absolutePath
                environment "ANDROID_NDK_HOME", ndkDir.absolutePath
            }
        }
        project.exec {
            workingDir = rustRootDir
            commandLine "cargo", "run", "--bin", "uniffi-bindgen", "generate",
                "--library", hostSoFile.absolutePath,
                "--language", "kotlin",
                "--out-dir", uniffiOutDir.absolutePath
        }
    }
}

// ---------------------------------------------------------------------------
// ObjectBox schema guard
// ---------------------------------------------------------------------------
// Kotlin and Dart open the same database. If their models differ, the runtime that opens it
// rewrites the schema and objects written by the other side can lose fields. The Kotlin model
// (objectbox-models/default.json, regenerated by kapt from the @Entity classes) must therefore
// stay identical to the Dart model (lib/objectbox-model.json, regenerated by build_runner).
def verifyObjectBoxModels = tasks.register("verifyObjectBoxModels") {
    def kotlinModel = file("objectbox-models/default.json")
    def dartModel = rootProject.file("../lib/objectbox-model.json")
    inputs.files(kotlinModel, dartModel)
    outputs.upToDateWhen { false }

    doLast {
        def strip
        strip = { node ->
            if (node instanceof Map) {
                node.findAll { k, v -> !k.toString().startsWith("_note") }.collectEntries { k, v -> [k, strip(v)] }
            } else if (node instanceof List) {
                node.collect { strip(it) }
            } else {
                node
            }
        }
        def normalize = { File f ->
            def m = strip(new groovy.json.JsonSlurper().parse(f))
            m.entities = m.entities.sort { it.id }.collect { e ->
                e.properties = e.properties.sort { it.id }
                e.relations = (e.relations ?: []).sort { it.id }
                e
            }
            m.remove("version") // generator version, not part of the schema
            m
        }
        def k = normalize(kotlinModel)
        def d = normalize(dartModel)
        if (k != d) {
            def diffs = []
            def walk
            walk = { String path, a, b ->
                if (a instanceof Map && b instanceof Map) {
                    (a.keySet() + b.keySet()).each { key -> walk("${path}.${key}", a[key], b[key]) }
                } else if (a instanceof List && b instanceof List && a.size() == b.size()) {
                    a.indices.each { i -> walk("${path}[${i}]", a[i], b[i]) }
                } else if (a != b) {
                    diffs << "  ${path}: kotlin=${a} dart=${b}"
                }
            }
            walk("model", k, d)
            throw new GradleException("ObjectBox models differ between Kotlin and Dart. Sharing the database " +
                "with mismatched schemas can lose user data. Update the Kotlin @Entity classes in " +
                "com.bluebubbles.messaging.objectbox to match lib/database (same names, UIDs and types).\n" +
                diffs.take(50).join("\n"))
        }
        logger.lifecycle("ObjectBox models match (${k.entities.size()} entities)")
    }
}

// The JSON models do not record everything that defines the on-disk format. In particular a
// String @Index is a hash index in Java but a value index in Dart, and the JSON says the same thing
// for both. So also compare the schemas that actually ship: the generated MyObjectBox.java against
// the generated lib/objectbox.g.dart. The comparison covers every property (matched by UID) and
// every flag that affects stored data or indexes.
def compareGeneratedObjectBoxSchemas = { File javaFile, File dartFile ->
    def flagValues = [ID: 1, NON_PRIMITIVE_TYPE: 2, NOT_NULL: 4, INDEXED: 8, RESERVED: 16, UNIQUE: 32,
                      ID_MONOTONIC_SEQUENCE: 64, ID_SELF_ASSIGNABLE: 128, INDEX_PARTIAL_SKIP_NULL: 256,
                      INDEX_PARTIAL_SKIP_ZERO: 512, VIRTUAL: 1024, INDEX_HASH: 2048, INDEX_HASH64: 4096,
                      UNSIGNED: 8192, ID_COMPANION: 16384, UNIQUE_ON_CONFLICT_REPLACE: 32768, EXPIRATION_TIME: 65536]
    // Every flag must match except NON_PRIMITIVE_TYPE, which ObjectBox documents as a Java-only
    // detail (nullable wrapper types). Do NOT add exceptions without proof: ID_SELF_ASSIGNABLE was once
    // treated as binding-only, and it made Kotlin inserts reuse IDs and overwrite existing messages.
    int storageMask = ~2
    def propertyTypes = [Bool: 1, Byte: 2, Short: 3, Char: 4, Int: 5, Long: 6, Float: 7, Double: 8, String: 9,
                         Date: 10, Relation: 11, DateNano: 12, Flex: 13, ByteVector: 23, StringVector: 30]

    def java = [:]
    def javaRe = /property\("(\w+)"(?:, "\w+"){0,2}, PropertyType\.(\w+)\)\.id\((\d+), (-?\d+)L\)(?:\s*\.flags\(([^)]*)\))?(?:\s*\.indexId\((\d+), (-?\d+)L\))?/
    (javaFile.text =~ javaRe).each { m ->
        int flags = m[5] ? m[5].split(/\|/).collect { flagValues[it.trim().tokenize('.').last()] as int }.sum() as int : 0
        java[m[4]] = [name: m[1], type: propertyTypes[m[2]], flags: flags & storageMask, index: m[7]]
    }
    def dart = [:]
    def dartRe = /ModelProperty\(\s*id: const obx_int\.IdUid\((\d+), (\d+)\),\s*name: '(\w+)',\s*type: (\d+),\s*flags: (\d+)(?:,\s*indexId: const obx_int\.IdUid\((\d+), (\d+)\))?/
    (dartFile.text =~ dartRe).each { m ->
        dart[m[2]] = [name: m[3], type: m[4] as int, flags: (m[5] as int) & storageMask, index: m[7]]
    }

    def problems = []

    // Entity flags. USE_NO_ARG_CONSTRUCTOR (1) is Java-only (the C core does not define it).
    def javaEntityFlags = [:]
    (javaFile.text =~ /entityBuilder\.id\((\d+), (-?\d+)L\)[^\n]*\n(?:\s*entityBuilder\.flags\(([^)]*)\);)?/).each { m ->
        int f = m[3] ? m[3].split(/\|/).collect { [USE_NO_ARG_CONSTRUCTOR: 1, SYNC_ENABLED: 2, SHARED_GLOBAL_IDS: 4][it.trim().tokenize('.').last()] as int }.sum() as int : 0
        javaEntityFlags[m[2]] = f & ~1
    }
    def dartEntityFlags = [:]
    (dartFile.text =~ /ModelEntity\(\s*id: const obx_int\.IdUid\((\d+), (\d+)\),\s*name: '(\w+)',\s*lastPropertyId: const obx_int\.IdUid\(\d+, \d+\),\s*flags: (\d+)/).each { m ->
        dartEntityFlags[m[2]] = m[4] as int
    }
    if (javaEntityFlags.size() != dartEntityFlags.size() || javaEntityFlags.isEmpty()) {
        problems << "entity count/parse mismatch (kotlin=${javaEntityFlags.size()}, dart=${dartEntityFlags.size()})"
    }
    javaEntityFlags.each { uid, f ->
        if (dartEntityFlags[uid] != f) problems << "entity uid ${uid}: kotlin flags=${f} dart flags=${dartEntityFlags[uid]}"
    }

    if (java.isEmpty() || dart.isEmpty()) {
        problems << "could not parse properties (java=${java.size()}, dart=${dart.size()}); the generator output format changed, update this check"
    }
    (java.keySet() + dart.keySet()).each { uid ->
        def j = java[uid]
        def d = dart[uid]
        if (j == null || d == null) {
            problems << "property uid ${uid}: only in ${j == null ? 'Dart' : 'Kotlin'} (${(j ?: d).name})"
        } else if (j.type != d.type || j.flags != d.flags || j.index != d.index) {
            problems << "${d.name} (uid ${uid}): kotlin type=${j.type} flags=${j.flags} index=${j.index} / dart type=${d.type} flags=${d.flags} index=${d.index}"
        }
    }
    if (!problems.isEmpty()) {
        throw new GradleException("Generated ObjectBox schemas differ between Kotlin (${javaFile}) and Dart (${dartFile}). " +
            "Opening the shared database with a different index type or uniqueness corrupts lookups and can lose user data. " +
            "Fix the Kotlin @Entity annotations (e.g. @Index(type = IndexType.VALUE)) to match Dart.\n  " + problems.take(50).join("\n  "))
    }
    return java.size()
}

android.applicationVariants.all { variant ->
    def buildType = variant.buildType.name
    def isRelease = (buildType == "release")
    def variantOutputsDir = file("${buildDir}/rustlib/${variant.name}")

    def rustBuildTasks = []

    rustAbis.each { abi, targetTriple ->
        def taskName = "rustBuild_${rustLibName}_${abi}_${variant.name}"
        def outAbiDir = new File(variantOutputsDir, abi)
        def targetProfile = isRelease ? "release" : "debug"
        def builtSoFile = new File(cargoTargetDir, "${targetTriple}/${targetProfile}/lib${rustLibName}.so")

        def rustTask = tasks.register(taskName, Exec) {
            workingDir = rustRootDir

            def cmd = ["cargo", "ndk", "-t", abi, "-P", "${rustApi}", "build", "--target-dir", cargoTargetDir.absolutePath]
            if (isRelease) {
                cmd.add("--release")
            }
            commandLine cmd

            def ndkDir = android.ndkDirectory ?: (android.ndkVersion ? new File(android.sdkDirectory, "ndk/${android.ndkVersion}") : null)
            if (ndkDir != null && ndkDir.exists()) {
                environment "NDK_HOME", ndkDir.absolutePath
                environment "ANDROID_NDK_HOME", ndkDir.absolutePath
            }

            inputs.files(
                fileTree(rustRootDir) {
                    include "**/*.rs"
                    exclude "target/**"
                },
                fileTree(rootProject.file("../rustpush")) {
                    include "**/*.rs"
                    exclude "target/**"
                },
                file("${rustRootDir}/Cargo.toml"),
                file("${rustRootDir}/Cargo.lock"),
                file("${rustRootDir}/build.rs"),
                file("${rustRootDir}/.cargo/config.toml")
            )
            outputs.dir(outAbiDir)

            doLast {
                outAbiDir.mkdirs()
                copy {
                    from builtSoFile
                    into outAbiDir
                }
            }
        }
        rustBuildTasks.add(rustTask)
    }

    // Only the variant-specific source set: variant.sourceSets also contains shared ones
    // (main, debug, flavor), which would leak every variant's .so into every other variant.
    android.sourceSets.maybeCreate(variant.name).jniLibs.srcDir(variantOutputsDir)

    def capitalizedVariant = variant.name.capitalize()
    // toString(): `in` on a list of GStrings never matches a String task name
    def mergeTaskNames = ["merge${capitalizedVariant}JniLibFolders", "merge${capitalizedVariant}NativeLibs", "merge${variant.buildType.name.capitalize()}NativeLibs"]*.toString()
    tasks.matching { it.name in mergeTaskNames }.configureEach { mergeTask ->
        mergeTask.dependsOn(rustBuildTasks)
    }
    // Kotlin bindings live in src/main/kotlin and must be regenerated before anything reads the
    // sources (kapt, compile), or the dex and the .so drift apart
    tasks.matching { it.name == "pre${capitalizedVariant}Build".toString() }.configureEach { preTask ->
        preTask.dependsOn("rustUniffiKotlin")
    }
    // Check after kapt (which regenerates the Kotlin model) and before anything is packaged
    verifyObjectBoxModels.configure { mustRunAfter("kapt${capitalizedVariant}Kotlin") }
    def verifySchemas = tasks.register("verifyObjectBoxSchemas${capitalizedVariant}") {
        dependsOn("kapt${capitalizedVariant}Kotlin")
        def javaFile = file("${buildDir}/generated/source/kapt/${variant.name}/com/bluebubbles/messaging/objectbox/MyObjectBox.java")
        def dartFile = rootProject.file("../lib/objectbox.g.dart")
        inputs.files(javaFile, dartFile)
        outputs.upToDateWhen { false }
        doLast {
            int n = compareGeneratedObjectBoxSchemas(javaFile, dartFile)
            logger.lifecycle("ObjectBox generated schemas match (${n} properties)")
        }
    }
    tasks.matching { it.name == "package${capitalizedVariant}".toString() }.configureEach { packageTask ->
        packageTask.dependsOn(verifyObjectBoxModels, verifySchemas)
    }
}


// For Cloud Firestore okio error
configurations.all { configuration ->
    if (!configuration.name.toLowerCase().contains("kapt")) {
        resolutionStrategy {
            force 'com.squareup.okhttp:okhttp:2.7.5'
            force 'com.squareup.okio:okio:1.17.5'
        }
    }
}

